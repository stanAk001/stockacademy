# Secret scan — blocks accidental commits of keys, tokens and credentials.
#
# Runs gitleaks on every push and pull request. If a commit contains something
# that looks like a secret (API key, private key, database URL with a password,
# payment key...), this check fails so it's caught before it sits in a public
# repo. Free for personal accounts; no setup needed.
#
# If it flags something that is genuinely not a secret, add the finding's
# fingerprint to a .gitleaksignore file in the repo root.

name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
