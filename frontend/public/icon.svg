<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed ground: iOS and Android apply their own mask, so the artwork
       must not round its own corners or it shows a dark halo inside the mask. -->
  <rect width="512" height="512" fill="#0F1419"/>

  <!-- Faint baseline grid — reads as "chart" even at 40px, without clutter. -->
  <g stroke="#FDF8F0" stroke-opacity="0.07" stroke-width="3">
    <line x1="86" y1="150" x2="426" y2="150"/>
    <line x1="86" y1="256" x2="426" y2="256"/>
    <line x1="86" y1="362" x2="426" y2="362"/>
  </g>

  <!-- The climb. Ends on its high, which is the whole point of the mark. -->
  <path d="M92 372 L186 258 L262 312 L348 176 L424 116"
        fill="none" stroke="#FBBF24" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live marker: the one green note in the brand, on the final point. -->
  <circle cx="424" cy="116" r="30" fill="#0F1419"/>
  <circle cx="424" cy="116" r="22" fill="#10B981"/>
</svg>
